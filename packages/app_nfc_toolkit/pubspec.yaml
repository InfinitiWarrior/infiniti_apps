name: app_nfc_toolkit
description: "Local-only NFC tag reader/writer: read, write NDEF, format, and hex-dump tags."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../core
  nfc_manager: ^4.2.1
  ndef_record: ^1.4.2
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.27

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
