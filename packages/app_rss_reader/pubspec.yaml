name: app_rss_reader
description: "Local-first RSS/Atom reader with offline article cache."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../core
  dart_rss: ^3.0.3
  http: ^1.6.0
  intl: ^0.19.0
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.27
  workmanager: ^0.9.0+3
  url_launcher: ^6.3.2
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
