name: app_voice_recorder
description: "Local-only voice recorder with AAC/WAV capture and playback."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  core:
    path: ../core
  record: ^6.1.1
  just_audio: ^0.10.4
  drift: ^2.23.0
  sqlite3_flutter_libs: ^0.5.27
  shared_preferences: ^2.3.3
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
